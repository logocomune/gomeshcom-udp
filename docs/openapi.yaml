openapi: 3.0.3
info:
  title: gomeshcomd API
  version: 0.10.0
  description: |
    HTTP and Server-Sent Events API exposed by gomeshcomd.
    Static frontend routes are served by the same HTTP listener but are not
    part of this API contract.
servers:
  - url: http://127.0.0.1:8080
    description: Default local server
tags:
  - name: Health
    description: Service health
  - name: Session
    description: Authentication session management
  - name: Messages
    description: Outgoing MeshCom messages
  - name: Positions
    description: Persisted MeshCom node positions
  - name: Events
    description: Server-Sent Events stream
  - name: Station
    description: Runtime station identity (active callsign)
  - name: Channels
    description: Frontend channel visibility preferences
  - name: Chat
    description: SQLite-backed chat history and read state
  - name: Stats
    description: Hourly packet statistics
  - name: Config
    description: Runtime daemon configuration (read and partial update)
  - name: Admin
    description: Daemon lifecycle control (restart, shutdown)
security:
  - sessionCookie: []
paths:
  /api/session:
    security: []
    get:
      tags: [Session]
      summary: Return authentication status
      description: |
        Returns whether authentication is required and whether the current
        request carries a valid session cookie. This endpoint is always
        accessible — it does not require a valid session.

        When authentication is required but the caller is not authenticated,
        returns `401` with `authenticated: false` so clients can distinguish
        "auth disabled" from "auth required but not logged in".
      operationId: getSession
      responses:
        "200":
          description: Authentication is disabled or caller is authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
              examples:
                authDisabled:
                  value:
                    required: false
                    authenticated: true
                authenticated:
                  value:
                    required: true
                    authenticated: true
        "401":
          description: Authentication is required and caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
              examples:
                unauthenticated:
                  value:
                    required: true
                    authenticated: false
    post:
      tags: [Session]
      summary: Create a session (log in)
      description: |
        Validates username and password and sets an `HttpOnly` session cookie
        valid for `GOMESHCOM_AUTH_SESSION_TTL` (default `24h`). The cookie name
        is controlled by `GOMESHCOM_AUTH_COOKIE_NAME` (default
        `meshcom_session`). Request body is capped at 1 KB.

        When authentication is not configured, returns `204` immediately
        without reading the body.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value:
                  username: admin
                  password: secret
      responses:
        "204":
          description: Session created (or auth disabled — cookie set regardless).
          headers:
            Set-Cookie:
              description: Session cookie. HttpOnly, SameSite=Lax.
              schema:
                type: string
        "400":
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session token generation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Session]
      summary: Delete a session (log out)
      description: |
        Invalidates the current session token and clears the session cookie.
        Always returns `204`, even if no session is present or authentication is
        disabled.
      operationId: deleteSession
      responses:
        "204":
          description: Session invalidated (or auth disabled).
          headers:
            Set-Cookie:
              description: Expired session cookie (MaxAge=-1).
              schema:
                type: string
  /api/health:
    security: []
    get:
      tags: [Health]
      summary: Return service health
      operationId: getHealth
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    transport:
                      mode: udp
                      state: connected
                      endpoint: "0.0.0.0:1799"
                      retry_count: 0
  /api/messages:
    post:
      tags: [Messages]
      summary: Send an outgoing text message
      description: |
        Validates the request, suppresses immediate duplicates via the send
        cache, then sends the message through the configured transport. After
        accept, the server waits up to 5 seconds for the node echo; if none
        arrives, it persists a chat record with `delivery_status: failed` and
        emits `message.failed`.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
            examples:
              broadcast:
                value:
                  dst: "*"
                  msg: hello
      responses:
        "202":
          description: Message accepted for transport send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutgoingText"
        "400":
          description: Invalid JSON or invalid message fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJson:
                  value:
                    error: invalid json
                emptyMessage:
                  value:
                    error: message is required
        "429":
          description: Duplicate message suppressed by send cache.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds before retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateResponse"
        "502":
          description: Transport send failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Transport is unavailable, disconnected, or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/positions:
    get:
      tags: [Positions]
      summary: Return persisted node positions
      operationId: listPositions
      responses:
        "200":
          description: Map keyed by source callsign.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PositionRecord"
              examples:
                oneNode:
                  value:
                    QQ1ABC-1:
                      lat: 48.1
                      lng: 16.3
                      alt: 123
                      hw_id: "42"
                      firstseen: "2026-05-15T10:00:00Z"
                      lastseen: "2026-05-15T10:05:00Z"
                      lastdirectseen: "2026-05-15T10:05:00Z"
                      rssi: -90
                      snr: 8
                      via:
                        - QQ5AKT-10
                        - QQ5PFI-1
  /api/events:
    get:
      tags: [Events]
      summary: Stream live and replayed events
      description: |
        Opens a Server-Sent Events stream.

        The stream starts with a `heartbeat` event, then emits
        `station.identity`, optionally `positions.snapshot`,
        `chatstatus.snapshot` (unread counts per conversation), `channelshow.snapshot` (frontend channel visibility), then recent
        replayed `packet.received` events from the raw receive log, followed by
        live events. A `heartbeat` event is sent every 15 seconds. Failed
        outbound echo tracking emits `message.failed` with a `ChatRecord`
        payload.
      operationId: streamEvents
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                startup:
                  value: |
                    event: heartbeat
                    data: {}

                    event: station.identity
                    data: {"callsign":"QQ0XX-1"}

                    event: positions.snapshot
                    data: {}

                    event: chatstatus.snapshot
                    data: {"P_broadcast":{"lastMsgReceived":"2026-05-24T10:00:00Z","lastRead":"2026-05-24T09:55:00Z","unreadCount":3}}

                    event: channelshow.snapshot
                    data: {"mode":"allowlist","channels":["*","222"]}
        "500":
          description: Streaming unsupported by the response writer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/channel-show:
    get:
      tags: [Channels]
      summary: Return channel visibility preferences
      description: |
        Returns the frontend channel visibility preference. This preference is
        not applied to packet receive, logging, chat status, replay, or live SSE
        delivery; clients use it only to hide channel list entries.
      operationId: getChannelShow
      responses:
        "200":
          description: Current channel visibility preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelShowConfig"
              examples:
                all:
                  value:
                    mode: all
                    channels: []
                allowlist:
                  value:
                    mode: allowlist
                    channels: ["*", "222"]
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Channels]
      summary: Replace channel visibility preferences
      description: |
        Replaces the frontend channel visibility preference. The body may be a
        structured object or a raw channel array shorthand. Raw arrays are
        treated as `mode: allowlist`. Valid channels are `*` (Broadcast) and
        numeric channel IDs.
      operationId: updateChannelShow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelShowConfig"
            examples:
              all:
                value:
                  mode: all
                  channels: []
              allowlist:
                value:
                  mode: allowlist
                  channels: ["*", "222", "22201"]
              arrayShorthand:
                value: ["*", "222"]
      responses:
        "200":
          description: Normalized preference stored in SQLite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelShowConfig"
        "400":
          description: Invalid JSON, mode, or channel entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Channel visibility store is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/adm/configs/my-call:
    get:
      tags: [Station]
      summary: Return the active station callsign
      description: |
        Returns the runtime station identity including the active callsign,
        daemon version, TX-disabled flag, and number of active forward targets.
        The callsign reflects any runtime update made via PUT — it is not
        necessarily the value of `GOMESHCOM_MY_CALL`.
      operationId: getMyCall
      responses:
        "200":
          description: Current station identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationIdentity"
              example:
                callsign: IU5PMP-1
                version: v0.9.0
                txDisabled: false
                forwardTargetCount: 0
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Station]
      summary: Update the active station callsign at runtime
      description: |
        Replaces the active station callsign without restarting the daemon.
        The new value is normalized (trim + uppercase), validated against the
        pattern `^[A-Z0-9]{3,10}(?:-[0-9]{1,2})?$`, and persisted synchronously
        to SQLite before responding.

        On success the backend publishes a `station.identity` SSE event so all
        connected clients update immediately. DM file routing, echo suppression,
        and outbox source reflect the new callsign from the next message
        processed.

        The persisted value wins over `GOMESHCOM_MY_CALL` at the next startup.
      operationId: updateMyCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyCallRequest"
            example:
              callsign: IU5PMP-2
      responses:
        "200":
          description: Callsign updated and persisted. SSE broadcast triggered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationIdentity"
        "400":
          description: Invalid JSON or callsign does not match the allowed pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Callsign accepted but persistence to disk failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/chat/list:
    get:
      tags: [Chat]
      summary: List discovered chat conversations
      operationId: listConversations
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            Filtering scope for DM conversations.
            - `mycall` (default): include only DMs where the my-side record matches the active full callsign-with-SSID. Conversation IDs are returned in `DM_<mycall-ssid>_<peer>` form.
            - `basecall`: include all DMs sharing the operator base callsign. Conversation IDs are returned in `DM_<basecall>_<peer>` form.
          schema:
            type: string
            enum: [mycall, basecall]
            default: mycall
      responses:
        "200":
          description: Conversation list sorted by last seen descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "500":
          description: Chat log directory could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/{conversation}:
    get:
      tags: [Chat]
      summary: Return chat history for one conversation
      operationId: getConversation
      parameters:
        - name: conversation
          in: path
          required: true
          description: |
            Conversation ID. Accepted forms:
            - `P_broadcast` — global broadcast channel
            - `P_<channel>` — numeric channel (e.g. `P_262`)
            - `DM_<mycall-ssid>_<peer>` — direct message in mycall scope (e.g. `DM_IU5PMP-1_IK5FCK-10`)
            - `DM_<basecall>_<peer>` — direct message in basecall scope (e.g. `DM_IU5PMP_IK5FCK-10`)
          schema:
            type: string
            pattern: "^[A-Za-z0-9_*-]([A-Za-z0-9_*-]*[A-Za-z0-9_*-])?$"
          examples:
            broadcast:
              value: P_broadcast
            channel:
              value: P_262
            direct_mycall:
              value: DM_IU5PMP-1_IK5FCK-10
            direct_basecall:
              value: DM_IU5PMP_IK5FCK-10
        - name: scope
          in: query
          required: false
          description: |
            Filtering scope for DM conversations.
            - `mycall` (default): filter records to those where the my-side callsign matches the active full SSID.
            - `basecall`: return all records from the shared basecall file without SSID filtering.
          schema:
            type: string
            enum: [mycall, basecall]
            default: mycall
        - name: hours
          in: query
          required: false
          description: History window in hours. Defaults to server config for `P_broadcast`/`P_<channel>` and to 30 days for DM conversations. Capped by server config.
          schema:
            type: number
            format: double
            exclusiveMinimum: true
            minimum: 0
      responses:
        "200":
          description: Chat records sorted ascending by receive time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRecord"
        "400":
          description: Invalid conversation ID or hours parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Chat history could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Chat]
      summary: Delete chat history for one conversation
      description: |
        Removes the conversation from SQLite, including its read marker, so it
        cannot reappear with stale unread state after a restart.
      operationId: deleteConversation
      parameters:
        - name: conversation
          in: path
          required: true
          description: Conversation ID. Accepted forms are `P_broadcast`, `P_<channel>`, and `DM_<CALLSIGN>_<PEER>`.
          schema:
            type: string
            pattern: "^(P_broadcast|P_\\d+|DM_[A-Z0-9_-]+)$"
      responses:
        "204":
          description: Conversation deleted successfully.
        "400":
          description: Invalid conversation ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Chatlog is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Conversation could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/{conversation}/read:
    post:
      tags: [Chat]
      summary: Mark a conversation as read
      description: |
        Zeroes the unread counter and sets `lastRead` for the given
        conversation. Idempotent — calling it when `unreadCount` is already 0
        is a no-op (still returns 204). The updated state is reflected in the
        next `chatstatus.snapshot` SSE event on a new connection.
      operationId: markConversationRead
      parameters:
        - name: conversation
          in: path
          required: true
          description: Conversation ID. Accepted forms are `P_broadcast`, `P_<channel>`, and `DM_<CALLSIGN>_<PEER>`.
          schema:
            type: string
            pattern: "^(P_broadcast|P_\\d+|DM_[A-Z0-9_-]+)$"
          examples:
            broadcast:
              value: P_broadcast
            channel:
              value: P_262
            direct:
              value: DM_IU5PMP-1_QQ1ABC-7
      responses:
        "204":
          description: Conversation marked as read.
        "400":
          description: Invalid conversation ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/stats:
    get:
      tags: [Stats]
      summary: Return hourly packet statistics
      description: |
        Returns aggregated hourly packet counters for the configured window.
        Default window is 24 hours; maximum is 720 hours (30 days).
        The `hours` query parameter is silently capped to the maximum.
      operationId: listStats
      parameters:
        - name: hours
          in: query
          required: false
          description: Window in hours. Default 24, max 720.
          schema:
            type: integer
            minimum: 1
            default: 24
      responses:
        "200":
          description: Statistics response with hourly buckets sorted ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
              examples:
                typical:
                  value:
                    from: "2026-06-12T10:00:00Z"
                    to: "2026-06-13T10:00:00Z"
                    hours: 24
                    buckets:
                      - hour: 1749808800
                        dm: 2
                        dm_ack: 1
                        public: 5
                        telemetry: 3
                        position: 8
                        errors: 0
                        total: 19
        "400":
          description: Invalid `hours` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Statistics store read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/stats/dm:
    get:
      tags: [Stats]
      summary: Return per-callsign DM delivery statistics
      description: |
        Returns a map of callsign → `{sent, ack}` counters stored in SQLite.
        Returns an empty object when the DM statistics store is not configured.
      operationId: listDMStats
      responses:
        "200":
          description: Map keyed by peer callsign.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/DMStatsEntry"
              examples:
                typical:
                  value:
                    IK5FCK-10:
                      sent: 4
                      ack: 3
                    QQ1ABC-1:
                      sent: 1
                      ack: 0
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/config:
    get:
      tags: [Config]
      summary: Return the current daemon configuration
      description: |
        Returns the full effective configuration including which fields are
        currently overridden by environment variables and which require a restart
        to take effect. The `auth.password` value is always masked as `"****"`.

        Returns `403` when demo mode is active.
      operationId: getConfig
      responses:
        "200":
          description: Current effective configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Config API disabled in demo mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Config]
      summary: Partially update the daemon configuration
      description: |
        Merges the supplied fields onto the current effective configuration.
        Omitted fields are left unchanged. Duration values use Go duration
        strings (e.g. `"40s"`, `"2h"`); storage purge durations also accept
        day suffixes such as `"30d"`.

        Fields currently managed by environment variables cannot be changed via
        this endpoint and return `409`. Fields that require a daemon restart are
        flagged in the response via `requires_restart: true`.

        On success the updated configuration is written to the TOML config file
        (if `WithTomlPath` is configured); a changed callsign also triggers an
        immediate `station.identity` SSE broadcast.

        Returns `403` when demo mode is active.
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdateRequest"
            examples:
              changeLogLevel:
                value:
                  log_level: debug
              changeChatWindow:
                value:
                  chat_log:
                    history_window: "48h"
      responses:
        "200":
          description: Updated configuration and restart flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUpdateResponse"
        "400":
          description: Invalid JSON or invalid field value (e.g. bad duration string).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Config API disabled in demo mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Field is locked by an environment variable and cannot be changed at runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: TOML persistence failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/restart:
    post:
      tags: [Admin]
      summary: Restart the daemon process
      description: |
        Triggers a daemon restart. Responds immediately with `200` so the client
        can receive the confirmation before the process exits, then performs the
        restart after a 500 ms delay.

        Returns `501` when no restart callback has been registered (i.e. the
        binary was not started with restart support).
      operationId: restartDaemon
      responses:
        "200":
          description: Restart triggered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonActionResponse"
              examples:
                restarting:
                  value:
                    status: restarting
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Restart not configured.

  /api/shutdown:
    post:
      tags: [Admin]
      summary: Shut down the daemon process
      description: |
        Triggers a graceful daemon shutdown. Responds immediately with `200` so
        the client can receive the confirmation before the process exits, then
        shuts down after a 500 ms delay.

        Returns `501` when no shutdown callback has been registered.
      operationId: shutdownDaemon
      responses:
        "200":
          description: Shutdown triggered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonActionResponse"
              examples:
                shuttingDown:
                  value:
                    status: shutting down
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Shutdown not configured.

components:
  schemas:
    StationIdentity:
      type: object
      required: [callsign]
      properties:
        callsign:
          type: string
          description: Active station callsign (normalized, uppercase).
          example: IU5PMP-1
        version:
          type: string
          description: Daemon version string.
          example: v0.9.0
        txDisabled:
          type: boolean
          description: True when dry-run TX mode is active.
          example: false
        forwardTargetCount:
          type: integer
          description: Number of active UDP forward targets.
          example: 0
    UpdateMyCallRequest:
      type: object
      required: [callsign]
      properties:
        callsign:
          type: string
          description: |
            New callsign. Trimmed and uppercased before validation.
            Must match `^[A-Z0-9]{3,10}(?:-[0-9]{1,2})?$`.
          example: IU5PMP-2
    SessionStatus:
      type: object
      required: [required, authenticated]
      properties:
        required:
          type: boolean
          description: True when `GOMESHCOM_AUTH_USERNAME` and `GOMESHCOM_AUTH_PASSWORD` are both set.
          example: true
        authenticated:
          type: boolean
          description: True when the request carries a valid, non-expired session cookie.
          example: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: secret
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: degraded
        version:
          type: string
        callsign:
          type: string
          example: QQ0QQ-1
        started_at:
          type: string
          format: date-time
        transport:
          $ref: "#/components/schemas/TransportStatus"

    TransportStatus:
      type: object
      required: [mode, state, endpoint, retry_count]
      properties:
        mode:
          type: string
          enum: [udp, serial, netconsole]
        state:
          type: string
          enum: [disconnected, connecting, connected, degraded, stopped]
        endpoint:
          type: string
          description: UDP listen address, explicit serial device, or NETConsole TCP endpoint.
        last_error:
          type: string
        last_error_at:
          type: string
          format: date-time
        connected_at:
          type: string
          format: date-time
        retry_count:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid json
    DuplicateResponse:
      type: object
      required: [error, retry_after_ms]
      properties:
        error:
          type: string
          example: duplicate
        retry_after_ms:
          type: integer
          example: 2000
    CreateMessageRequest:
      type: object
      required: [dst, msg]
      properties:
        dst:
          type: string
          description: Destination callsign or group target. `*` means broadcast.
          example: "*"
        msg:
          type: string
          description: UTF-8 message text. Maximum length follows server config.
          example: hello
    OutgoingText:
      type: object
      required: [type, dst, msg]
      properties:
        type:
          $ref: "#/components/schemas/PacketType"
        dst:
          type: string
          example: "*"
        msg:
          type: string
          example: hello
    Conversation:
      type: object
      required: [id, kind, label, last_seen, size]
      properties:
        id:
          type: string
          example: DM_QQ1ABC-7
        kind:
          type: string
          enum: [broadcast, channel, dm]
          example: dm
        label:
          type: string
          example: QQ1ABC-7
        last_seen:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          example: 4096
    ChatRecord:
      type: object
      required: [received_at, msg]
      properties:
        received_at:
          type: string
          format: date-time
        src:
          type: string
          example: QQ1ABC-1
        src_type:
          type: string
          enum: [lora, udp, node]
        via:
          type: array
          description: Relay callsigns between origin and local node.
          items:
            type: string
        dst:
          type: string
          example: "*"
        msg_id:
          type: string
          example: 5DFC7187
        sequence_id:
          type: string
          description: MeshCom outbound DM sequence identifier.
          example: "1234"
        msg:
          type: string
          example: hello
        rssi:
          type: integer
          example: -95
        snr:
          type: integer
          example: 12
        direction:
          type: string
          enum: [outbound]
          example: outbound
        delivery_status:
          type: string
          enum: [failed]
          example: failed
        ack_status:
          type: string
          enum: [ack, rej]
        ack_received_at:
          type: string
          format: date-time
        ack_src:
          type: string
        ack_src_type:
          type: string
          enum: [lora, udp, node]
        ack_rssi:
          type: integer
        ack_snr:
          type: integer
        ack_via:
          type: array
          items:
            type: string
    TextMessage:
      type: object
      required: [type, msg]
      properties:
        type:
          $ref: "#/components/schemas/PacketType"
        src:
          type: string
          example: QQ1ABC-1
        dst:
          type: string
          example: "*"
        msg:
          type: string
          example: hello
        msg_id:
          type: string
          example: 5DFC7187
        src_type:
          type: string
          enum: [lora, udp, node]
          example: lora
        firmware:
          oneOf:
            - type: string
            - type: number
          example: "4.35"
        fw_sub:
          oneOf:
            - type: string
            - type: number
          example: p
        rssi:
          type: integer
          example: -95
        snr:
          type: integer
          example: 12
    PositionRecord:
      type: object
      required: [lat, lng, alt, firstseen, lastseen, rssi, snr, via]
      properties:
        lat:
          type: number
          format: double
          example: 48.1
        lng:
          type: number
          format: double
          example: 16.3
        alt:
          type: integer
          example: 123
        hw_id:
          type: string
          example: "42"
        firstseen:
          type: string
          format: date-time
        lastseen:
          type: string
          format: date-time
        lastdirectseen:
          type: string
          format: date-time
        rssi:
          type: integer
          example: -90
        snr:
          type: integer
          example: 8
        via:
          type: array
          items:
            type: string
          example: [QQ5AKT-10, QQ5PFI-1]
    ChannelShowConfig:
      type: object
      required: [mode, channels]
      properties:
        mode:
          type: string
          enum: [all, allowlist]
          description: "`all` shows every channel; `allowlist` shows only entries in `channels`."
          example: allowlist
        channels:
          type: array
          description: Channels visible when `mode` is `allowlist`. `*` means Broadcast; numeric strings mean public channels.
          items:
            type: string
            pattern: "^(\\*|\\d+)$"
          example: ["*", "222", "22201"]
    ChannelShowSnapshotEvent:
      allOf:
        - $ref: "#/components/schemas/ChannelShowConfig"
      description: |
        Frontend channel visibility preference emitted as `channelshow.snapshot`
        on every new `/api/events` connection. Backend packet receive, logging,
        chat status, replay, and live SSE delivery are not filtered by this setting.
    PacketReceivedEvent:
      type: object
      required: [remote_addr, packet]
      properties:
        remote_addr:
          type: string
          example: 192.168.0.2:1799
        packet:
          oneOf:
            - $ref: "#/components/schemas/TextMessage"
            - $ref: "#/components/schemas/PositionPacket"
            - $ref: "#/components/schemas/TelemetryPacket"
    StationIdentityEvent:
      type: object
      required: [callsign]
      properties:
        callsign:
          type: string
          example: QQ0XX-1
    PositionsSnapshotEvent:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PositionRecord"
    PositionPacket:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/PacketType"
        src:
          type: string
        msg:
          type: string
        msg_id:
          type: string
        src_type:
          type: string
          enum: [lora, udp, node]
        lat:
          type: number
          format: double
        lat_dir:
          type: string
          enum: [N, S]
        long:
          type: number
          format: double
        long_dir:
          type: string
          enum: [E, W]
        aprs_symbol:
          type: string
        aprs_symbol_group:
          type: string
        hw_id:
          oneOf:
            - type: string
            - type: number
        alt:
          type: integer
        batt:
          type: integer
        firmware:
          oneOf:
            - type: string
            - type: number
        fw_sub:
          oneOf:
            - type: string
            - type: number
        rssi:
          type: integer
        snr:
          type: integer
    TelemetryPacket:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/PacketType"
        src:
          type: string
        src_type:
          type: string
          enum: [lora, udp, node]
        temp1:
          type: number
          format: double
        temp2:
          type: number
          format: double
        hum:
          type: number
          format: double
        batt:
          type: integer
        qfe:
          type: number
          format: double
        qnh:
          type: number
          format: double
        gas:
          type: number
          format: double
        co2:
          type: number
          format: double
    PacketType:
      type: string
      enum: [msg, pos, tele]
    ChatStatusEntry:
      type: object
      required: [lastMsgReceived, lastRead, unreadCount]
      properties:
        lastMsgReceived:
          type: string
          format: date-time
          description: Timestamp of the last received inbound message (not a self-echo). Zero value if no message received yet.
          example: "2026-05-24T10:00:00Z"
        lastRead:
          type: string
          format: date-time
          description: Timestamp of the current SQLite read marker. Zero value if never read.
          example: "2026-05-24T09:55:00Z"
        unreadCount:
          type: integer
          minimum: 0
          description: Number of inbound messages since the last MarkRead call.
          example: 3
        lastMsg:
          type: string
          description: Raw text of the most recent inbound message. Omitted when no message has been received.
          example: hello world
    ChatStatusSnapshotEvent:
      type: object
      description: |
        Map keyed by conversation ID (`P_broadcast`, `P_<channel>`, `DM_<mycall>_<peer>`)
        with the current read/unread state for each thread.
        Emitted as the `chatstatus.snapshot` SSE event on every new `/api/events` connection.
      additionalProperties:
        $ref: "#/components/schemas/ChatStatusEntry"
      example:
        P_broadcast:
          lastMsgReceived: "2026-05-24T10:00:00Z"
          lastRead: "2026-05-24T09:55:00Z"
          unreadCount: 3
        DM_QQ1ABC-7:
          lastMsgReceived: "2026-05-24T08:30:00Z"
          lastRead: "2026-05-24T08:30:00Z"
          unreadCount: 0

    StatsBucket:
      type: object
      required: [hour, dm, dm_ack, public, telemetry, position, errors, total]
      description: Aggregated packet counters for a single UTC hour.
      properties:
        hour:
          type: integer
          format: int64
          description: UTC hour as Unix timestamp (start of the hour).
          example: 1749808800
        dm:
          type: integer
          description: Inbound direct messages received.
          example: 2
        dm_ack:
          type: integer
          description: DM acknowledgements received.
          example: 1
        public:
          type: integer
          description: Public (broadcast/channel) messages received.
          example: 5
        telemetry:
          type: integer
          description: Telemetry packets received.
          example: 3
        position:
          type: integer
          description: Position packets received.
          example: 8
        errors:
          type: integer
          description: Packets that failed to parse.
          example: 0
        total:
          type: integer
          description: Total packets received (all types).
          example: 19
        distance_km:
          type: object
          description: Per-callsign distance in km at time of last position packet.
          additionalProperties:
            type: integer
          example:
            IU5PMP-1: 12
        channels:
          type: object
          description: |
            Per-channel/per-DM message counts.
            Keys: `broadcast`, `ch:<N>` for public channels, `dm:<CALLSIGN>` for DMs.
          additionalProperties:
            type: integer
          example:
            broadcast: 5
            "ch:262": 2
            "dm:IK5FCK-10": 3

    StatsResponse:
      type: object
      required: [from, to, hours, buckets]
      properties:
        from:
          type: string
          format: date-time
          description: Start of the requested window (UTC).
          example: "2026-06-12T10:00:00Z"
        to:
          type: string
          format: date-time
          description: End of the requested window (UTC).
          example: "2026-06-13T10:00:00Z"
        hours:
          type: integer
          description: Effective window duration in hours.
          example: 24
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/StatsBucket"

    DMStatsEntry:
      type: object
      required: [sent, ack]
      description: DM delivery counters for a single peer callsign.
      properties:
        sent:
          type: integer
          description: Number of DMs sent to this peer.
          example: 4
        ack:
          type: integer
          description: Number of those DMs that received an acknowledgement.
          example: 3

    ConfigFieldMeta:
      type: object
      required: [value, env_override, requires_restart]
      description: A single configuration field with its metadata.
      properties:
        value:
          description: Current effective value of the field.
        env_override:
          type: boolean
          description: True when this field is currently managed by an environment variable and cannot be changed via the API.
          example: false
        requires_restart:
          type: boolean
          description: True when changing this field requires a daemon restart to take effect.
          example: true

    ConfigServerInfo:
      type: object
      required: [version, started_at, uptime_seconds]
      properties:
        version:
          type: string
          description: Daemon version string.
          example: v0.9.0
        started_at:
          type: string
          format: date-time
          description: Time the daemon started (UTC).
          example: "2026-06-13T08:00:00Z"
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since daemon start.
          example: 7200

    ConfigReceiveLogSection:
      type: object
      required: [enabled, path, retention_days, replay_window]
      properties:
        enabled:
          $ref: "#/components/schemas/ConfigFieldMeta"
        path:
          $ref: "#/components/schemas/ConfigFieldMeta"
        retention_days:
          $ref: "#/components/schemas/ConfigFieldMeta"
        replay_window:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigStatsSection:
      type: object
      required: [enabled, path, retention_days]
      properties:
        enabled:
          $ref: "#/components/schemas/ConfigFieldMeta"
        path:
          $ref: "#/components/schemas/ConfigFieldMeta"
        retention_days:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigChatLogSection:
      type: object
      required: [path, history_window, max_history_window]
      properties:
        path:
          $ref: "#/components/schemas/ConfigFieldMeta"
        history_window:
          $ref: "#/components/schemas/ConfigFieldMeta"
        max_history_window:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigSendSection:
      type: object
      required: [dedup_ttl]
      properties:
        dedup_ttl:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigForwardSection:
      type: object
      required: [targets]
      properties:
        targets:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigAuthSection:
      type: object
      required: [username, password, session_ttl, cookie_name]
      description: Authentication configuration. `password.value` is always `"****"`.
      properties:
        username:
          $ref: "#/components/schemas/ConfigFieldMeta"
        password:
          $ref: "#/components/schemas/ConfigFieldMeta"
        session_ttl:
          $ref: "#/components/schemas/ConfigFieldMeta"
        cookie_name:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigRequestLogSection:
      type: object
      required: [enabled]
      properties:
        enabled:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigStorageSection:
      type: object
      required:
        [
          sqlite_path,
          purge_interval,
          receive_log_retention,
          public_chat_retention,
          nodes_retention,
          telemetry_retention,
        ]
      properties:
        sqlite_path:
          $ref: "#/components/schemas/ConfigFieldMeta"
        purge_interval:
          $ref: "#/components/schemas/ConfigFieldMeta"
        receive_log_retention:
          $ref: "#/components/schemas/ConfigFieldMeta"
        public_chat_retention:
          $ref: "#/components/schemas/ConfigFieldMeta"
        nodes_retention:
          $ref: "#/components/schemas/ConfigFieldMeta"
        telemetry_retention:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigSerialSection:
      type: object
      required:
        [
          device,
          baud,
          data_bits,
          parity,
          stop_bits,
          flow_control,
          dtr,
          rts,
          read_timeout,
          reconnect_initial,
          reconnect_max,
          stable_reset_after,
          max_record_bytes,
        ]
      properties:
        device:
          $ref: "#/components/schemas/ConfigFieldMeta"
        baud:
          $ref: "#/components/schemas/ConfigFieldMeta"
        data_bits:
          $ref: "#/components/schemas/ConfigFieldMeta"
        parity:
          $ref: "#/components/schemas/ConfigFieldMeta"
        stop_bits:
          $ref: "#/components/schemas/ConfigFieldMeta"
        flow_control:
          $ref: "#/components/schemas/ConfigFieldMeta"
        dtr:
          $ref: "#/components/schemas/ConfigFieldMeta"
        rts:
          $ref: "#/components/schemas/ConfigFieldMeta"
        read_timeout:
          $ref: "#/components/schemas/ConfigFieldMeta"
        reconnect_initial:
          $ref: "#/components/schemas/ConfigFieldMeta"
        reconnect_max:
          $ref: "#/components/schemas/ConfigFieldMeta"
        stable_reset_after:
          $ref: "#/components/schemas/ConfigFieldMeta"
        max_record_bytes:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigNetConsoleSection:
      type: object
      required:
        [
          address,
          password,
          connect_timeout,
          auth_timeout,
          write_timeout,
          reconnect_initial,
          reconnect_max,
          stable_reset_after,
          max_auth_line_bytes,
          max_record_bytes,
        ]
      properties:
        address:
          $ref: "#/components/schemas/ConfigFieldMeta"
        password:
          $ref: "#/components/schemas/ConfigFieldMeta"
        connect_timeout:
          $ref: "#/components/schemas/ConfigFieldMeta"
        auth_timeout:
          $ref: "#/components/schemas/ConfigFieldMeta"
        write_timeout:
          $ref: "#/components/schemas/ConfigFieldMeta"
        reconnect_initial:
          $ref: "#/components/schemas/ConfigFieldMeta"
        reconnect_max:
          $ref: "#/components/schemas/ConfigFieldMeta"
        stable_reset_after:
          $ref: "#/components/schemas/ConfigFieldMeta"
        max_auth_line_bytes:
          $ref: "#/components/schemas/ConfigFieldMeta"
        max_record_bytes:
          $ref: "#/components/schemas/ConfigFieldMeta"

    ConfigResponse:
      type: object
      required:
        - server
        - http_addr
        - transport_mode
        - udp_listen_addr
        - node_addr
        - my_call
        - data_dir
        - max_message_length
        - log_level
        - receive_log
        - stats
        - chat_log
        - send
        - forward
        - auth
        - request_log
        - storage
        - serial
        - netconsole
      properties:
        server:
          $ref: "#/components/schemas/ConfigServerInfo"
        http_addr:
          $ref: "#/components/schemas/ConfigFieldMeta"
        transport_mode:
          $ref: "#/components/schemas/ConfigFieldMeta"
        udp_listen_addr:
          $ref: "#/components/schemas/ConfigFieldMeta"
        node_addr:
          $ref: "#/components/schemas/ConfigFieldMeta"
        my_call:
          $ref: "#/components/schemas/ConfigFieldMeta"
        data_dir:
          $ref: "#/components/schemas/ConfigFieldMeta"
        max_message_length:
          $ref: "#/components/schemas/ConfigFieldMeta"
        log_level:
          $ref: "#/components/schemas/ConfigFieldMeta"
        receive_log:
          $ref: "#/components/schemas/ConfigReceiveLogSection"
        stats:
          $ref: "#/components/schemas/ConfigStatsSection"
        chat_log:
          $ref: "#/components/schemas/ConfigChatLogSection"
        send:
          $ref: "#/components/schemas/ConfigSendSection"
        forward:
          $ref: "#/components/schemas/ConfigForwardSection"
        auth:
          $ref: "#/components/schemas/ConfigAuthSection"
        request_log:
          $ref: "#/components/schemas/ConfigRequestLogSection"
        storage:
          $ref: "#/components/schemas/ConfigStorageSection"
        serial:
          $ref: "#/components/schemas/ConfigSerialSection"
        netconsole:
          $ref: "#/components/schemas/ConfigNetConsoleSection"

    ConfigUpdateReceiveLog:
      type: object
      properties:
        enabled:
          type: boolean
        path:
          type: string
        retention_days:
          type: integer
        replay_window:
          type: string
          description: Go duration string, e.g. `"2h"`.
          example: "2h"

    ConfigUpdateStats:
      type: object
      properties:
        enabled:
          type: boolean
        path:
          type: string
        retention_days:
          type: integer

    ConfigUpdateChatLog:
      type: object
      properties:
        path:
          type: string
        history_window:
          type: string
          description: Go duration string, e.g. `"48h"`.
          example: "48h"
        max_history_window:
          type: string
          description: Go duration string, e.g. `"720h"`.
          example: "720h"

    ConfigUpdateSend:
      type: object
      properties:
        dedup_ttl:
          type: string
          description: Go duration string, e.g. `"30s"`.
          example: "30s"

    ConfigUpdateForward:
      type: object
      properties:
        targets:
          type: string
          description: Comma-separated list of UDP forward targets (host:port).
          example: "192.168.0.5:1799,10.0.0.1:1799"

    ConfigUpdateAuth:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        session_ttl:
          type: string
          description: Go duration string, e.g. `"24h"`.
          example: "24h"
        cookie_name:
          type: string
          example: meshcom_session

    ConfigUpdateRequestLog:
      type: object
      properties:
        enabled:
          type: boolean

    ConfigUpdateStorage:
      type: object
      properties:
        sqlite_path:
          type: string
          example: "./data/gomeshcom.db"
        purge_interval:
          type: string
          description: Duration string. TOML/API accept day suffixes such as `"30d"` in addition to Go duration strings.
          example: "4h"
        receive_log_retention:
          type: string
          description: Duration string. TOML/API accept day suffixes such as `"30d"` in addition to Go duration strings.
          example: "30d"
        public_chat_retention:
          type: string
          description: Duration string. TOML/API accept day suffixes such as `"30d"` in addition to Go duration strings.
          example: "30d"
        nodes_retention:
          type: string
          description: Duration string. TOML/API accept day suffixes such as `"7d"` in addition to Go duration strings.
          example: "7d"
        telemetry_retention:
          type: string
          description: Duration string. TOML/API accept day suffixes such as `"30d"` in addition to Go duration strings.
          example: "30d"

    ConfigUpdateSerial:
      type: object
      properties:
        device:
          type: string
          description: Explicit serial device path or Windows COM port.
          example: "/dev/ttyUSB0"
        baud:
          type: integer
          default: 115200
        data_bits:
          type: integer
          enum: [5, 6, 7, 8]
          default: 8
        parity:
          type: string
          enum: [none, odd, even, mark, space]
          default: none
        stop_bits:
          type: integer
          enum: [1, 2]
          default: 1
        flow_control:
          type: string
          enum: [none]
          default: none
        dtr:
          type: boolean
          description: Disable for ESP32/CP2102; enable for nRF52/RAK USB CDC.
          default: false
        rts:
          type: boolean
          description: Disable for ESP32/CP2102 unless hardware wiring requires it.
          default: false
        read_timeout:
          type: string
          default: "1s"
        reconnect_initial:
          type: string
          default: "1s"
        reconnect_max:
          type: string
          default: "30s"
        stable_reset_after:
          type: string
          default: "30s"
        max_record_bytes:
          type: integer
          default: 65536
          minimum: 1
          maximum: 1048576

    ConfigUpdateNetConsole:
      type: object
      properties:
        address:
          type: string
          example: "192.168.1.53:2323"
        password:
          type: string
          description: Password value, empty string to clear, or `****` to preserve the current password.
        connect_timeout:
          type: string
          default: "5s"
        auth_timeout:
          type: string
          default: "5s"
        write_timeout:
          type: string
          default: "5s"
        reconnect_initial:
          type: string
          default: "1s"
        reconnect_max:
          type: string
          default: "30s"
        stable_reset_after:
          type: string
          default: "30s"
        max_auth_line_bytes:
          type: integer
          default: 128
          minimum: 72
          maximum: 4096
        max_record_bytes:
          type: integer
          default: 65536
          minimum: 1
          maximum: 1048576

    ConfigUpdateRequest:
      type: object
      description: |
        Partial configuration update. Omitted fields are left unchanged.
        Duration values are Go duration strings (e.g. `"40s"`, `"2h"`).
        Storage purge durations also accept day suffixes such as `"30d"`.
        Fields managed by environment variables return `409` if present.
      properties:
        http_addr:
          type: string
          example: "0.0.0.0:8080"
        transport_mode:
          type: string
          enum: [udp, serial, netconsole]
          default: udp
        udp_listen_addr:
          type: string
          example: "0.0.0.0:1799"
        node_addr:
          type: string
          example: "192.168.0.2:1799"
        my_call:
          type: string
          example: QQ0QQ-1
        max_message_length:
          type: integer
          example: 160
        log_level:
          type: string
          enum: [debug, info, warn, error]
          example: info
        receive_log:
          $ref: "#/components/schemas/ConfigUpdateReceiveLog"
        stats:
          $ref: "#/components/schemas/ConfigUpdateStats"
        chat_log:
          $ref: "#/components/schemas/ConfigUpdateChatLog"
        send:
          $ref: "#/components/schemas/ConfigUpdateSend"
        forward:
          $ref: "#/components/schemas/ConfigUpdateForward"
        auth:
          $ref: "#/components/schemas/ConfigUpdateAuth"
        request_log:
          $ref: "#/components/schemas/ConfigUpdateRequestLog"
        storage:
          $ref: "#/components/schemas/ConfigUpdateStorage"
        serial:
          $ref: "#/components/schemas/ConfigUpdateSerial"
        netconsole:
          $ref: "#/components/schemas/ConfigUpdateNetConsole"

    ConfigUpdateResponse:
      type: object
      required: [config, requires_restart]
      properties:
        config:
          $ref: "#/components/schemas/ConfigResponse"
        requires_restart:
          type: boolean
          description: True when at least one changed field requires a daemon restart to take effect.
          example: false

    DaemonActionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [restarting, "shutting down"]
          example: restarting
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: meshcom_session
      description: |
        HTTP-only session cookie created by `POST /api/session`. Its actual
        name is configured by `GOMESHCOM_AUTH_COOKIE_NAME`.
